# Continuous integration for this fork: everything that needs no NVIDIA hardware.
#
#   kexts-linux   every kext source compiled to a Mach-O object with clang on Linux, the warning ceilings, and every
#                 symbol the objects import checked against the export lists of the macOS 15 and the macOS 26 kernel
#                 (build/kext_check.sh); the switch registry; the translator's own registry test. A few minutes; it
#                 gates every push.
#   host-tests    tools/run_all_tests.py on two Macs, an Apple-silicon and an Intel one (the tests compile Objective-C
#                 and read older revisions, so the clone is a full one), with the Vulkan headers the release compiles
#                 the plugin against (build/ci_vulkan_headers.sh, in NM_VULKAN_INCLUDE: a test that needs them fails
#                 rather than skips when they are wrong). The kexts are x86_64, so a tester's Mac is an Intel one, and
#                 an Intel Mac differs where the tests of the build script look: its Homebrew is in /usr/local/bin, on
#                 every shell's PATH. Each runner's job runs to its end and gates: a failing host test must not go
#                 unnoticed. The Intel runner has four slow processors, and tools/test_build_sh.py alone may take most
#                 of an hour beside the other tests there (the runner gives that test an hour), so the job has 80
#                 minutes. A test that made macOS start an on-demand install of the command line tools fails the job.
#   kexts-mac     the real kext builds with Xcode, once on an Apple-silicon runner and once on an Intel one: NVIDIA's
#                 RM core and NVKMS, then NVRM, NVRMFB, NVAccel (15 and 26), NVRMAGDC and NMSMN linked. Catches what a
#                 compile cannot: a duplicate or missing definition at link. NVIDIA's makefiles ask the compiler of the
#                 computer they run on which options it takes, and an Intel Mac's says yes to some that make a kext
#                 macOS cannot load, so after the link each run checks that no compile line carries such an option
#                 and that NVRM imports no ___x86_ helper, and prints a checksum of its compile lines (with the
#                 runner's own folders cut out and runs of spaces squeezed): the two runs' checksums must be equal.
#   plugin        the release compile of the Metal plugin (build/ci_plugin.sh) against the release's Vulkan headers.
#                 Needs the macOS 26 SDK.
#
# What GitHub's runners have shown (the logs of runs 43344333098 to 43419906041, 2026-11-13): kexts-linux and plugin
# green in every run. kexts-mac green on both runners in 43410589619 and 43419906041, with Xcode 26.3: NVIDIA's RM
# core (1121 commands) and NVKMS (225) compiled, every kext linked with 0 warnings, NVRM importing no ___x86_ helper,
# and the two runners' kexts equal byte for byte. Before that it had stopped at its import check on
# ____chkstk_darwin, a name the kext link itself provides (tools/kext_imports.py says why), and then at the link of
# NVRM, where the image's default Xcode, 16.4, brought a libkmod.a built for a newer macOS than the kext. The two
# runners' compile lines hold the same words in the same order and differed in spaces only: the make of macOS (GNU
# make 3.81) leaves a space where the compiler refused an option NVIDIA's makefile asked it about, so the checksum
# is taken with runs of spaces squeezed.
# host-tests red in every run so far. On the Apple-silicon runner, in 43419906041, 299 of 312 tests passed, the four
# that compile against the Vulkan headers among them, and tools/test_toolchain_sh.py failed (its stand-in build stops
# at its first tool on a Mac). On the Intel runner, whose first run was 43443873231, 298 of 314 passed and three
# failed for reasons of the tests' own: tools/test_build_sh.py had not ended after 1200 s beside the other tests,
# tools/test_dlss_fetch.sh wanted a zstd command, which macOS does not have, and the controls of
# tools/test_rtd3_hold.cpp got one sleep in their fixed time on the loaded runner; tools/test_ci_full_build.py was
# skipped: the compiler's command that made its stand-in for libSystem failed (its words were not kept).
# In 43429828046 and 43443873231 the tests left /private/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
# and an xcodebuild result bundle behind, and in no run before: those were the runs in which tools/test_build_sh.py
# handed Apple's own /usr/bin/make an SDKROOT that names no SDK, and the first two in which tools/test_toolchain_sh.py
# ran its stand-in build past its first tool (its make gets an empty folder as SDKROOT). On a Mac with a desktop that
# marker is taken to belong to the dialog that offers to install the command line tools (not seen: GitHub's log shows the file only).
# Every job gates: one that fails turns the run red.
# Actions are pinned to a commit. Downloads (NVIDIA open-gpu-kernel-modules, MacKernelSDK, xnu's export lists,
# Vulkan-Headers) are pinned in the scripts and build/pins.sh; none is copied into the repository or into an artifact.
# The token can read the repository and nothing else; no job uses a secret or uploads anything.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kexts-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0          # the registry test reads the previous commit and the 2.9 release (tag v2.9)
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9      # v6.1.0
        with:
          path: build-out/kext-check/src
          key: kext-check-src-${{ hashFiles('build/kext_check.sh', 'tools/kext_imports.py') }}
      - name: Compile every kext source and check its imports on both kernels
        run: bash build/kext_check.sh
      - name: Switch registry and the tests of this job's own tools
        # The runner exits 0 when a test it was asked for was skipped or could not be built, so the last line is held
        # to "all five ran and passed". Without the 2.9 release in the clone the registry test passes without comparing
        # the rows dated 2.9 with what that release read: say so where it is seen.
        run: |
          set -o pipefail
          python3 tools/run_all_tests.py test_switch_registry test_switch_report test_kext_check test_ci_workflow test_sysctl_allowlist | tee "$RUNNER_TEMP/tests.txt"
          grep -qx '5 passed, 0 failed, 0 skipped, 0 not run, of 5' "$RUNNER_TEMP/tests.txt"
          git rev-parse -q --verify refs/tags/v2.9 >/dev/null || echo "::warning::tag v2.9 is not in this repository, so the switch registry was not compared with the 2.9 release (push the tag to turn that on)"
      - name: Translator environment registry
        run: cargo test --manifest-path translator/translator/Cargo.toml --test env_registry
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel, as the kext job below: the tests must hold on both
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0          # negative controls read older revisions and tags
          persist-credentials: false
      - name: Which Vulkan headers (build/pins.sh)
        id: vkh
        run: echo "commit=$(sed -n 's/^NM_PIN_CI_VKHEADERS_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' build/pins.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9      # v6.1.0
        with:
          path: build-out/ci-vulkan-headers
          key: ci-vulkan-headers-${{ steps.vkh.outputs.commit }}
      - name: The release's Vulkan headers, for the tests that compile against them
        run: |
          d=$(bash build/ci_vulkan_headers.sh)
          echo "NM_VULKAN_INCLUDE=$d" >> "$GITHUB_ENV"
      - name: Host tests
        # The runner counts a skipped test as no failure. The tests that compile against vulkan/vulkan.h (the ones that
        # read NM_VULKAN_INCLUDE) skip only when no headers reach them, and here the step above gave them: a skip of one
        # of them fails the job, whatever kept the variable from it. --tail 20000: a failed test's output is printed
        # whole (up to 20000 characters), not only its last 1200, so that the log of a run shows which arm failed.
        # NMT_TIMES: tools/test_build_sh.py prints how long each of its groups took, so that a run in which it was
        # stopped at its limit shows where the time went.
        env:
          NMT_TIMES: "1"
        run: |
          set -o pipefail
          python3 tools/run_all_tests.py -j 4 --tail 20000 | tee "$RUNNER_TEMP/tests.txt"
          if grep -E '^skip (test_bc_small_mips|test_copy_null_image|test_graphics_bindings|test_opengl_perf)\.py:' "$RUNNER_TEMP/tests.txt"; then
            echo "::error::a test that needs the Vulkan headers was skipped: NM_VULKAN_INCLUDE did not reach it"; exit 1
          fi
      - name: No test made macOS start an install of the command line tools
        # Apple's small programs in /usr/bin (make, git, python3 and the rest) find the real tool through xcrun. Runs in
        # which they were handed an SDKROOT that names no SDK left the marker of an on-demand install of the command line
        # tools in /private/tmp (see the header), which in front of a tester would be Apple's dialog. The runner lists what
        # appeared in the temporary folders, each entry with the tests that were running when it was first seen: the
        # marker fails the job, also when a test failed.
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/tests.txt" ] || { echo "the tests did not run"; exit 0; }
          if grep -E '^left in .*: \.com\.apple\.dt\.CommandLineTools\.installondemand' "$RUNNER_TEMP/tests.txt"; then
            echo "::error::a test made macOS start an on-demand install of the command line tools (the line above names the tests that were running)"; exit 1
          fi
          echo "no marker of an on-demand install was left in the temporary folders"
  kexts-mac:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel, both macOS 15 (labels from GitHub's list of standard hosted runners)
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9      # v6.1.0
        with:
          path: build-out/kext-check/src
          key: kext-check-src-${{ hashFiles('build/kext_check.sh', 'tools/kext_imports.py') }}
      - name: Xcode 26 or later, as the release build needs
        # build.sh refuses an Xcode older than NM_PIN_TOOL_XCODE_MIN (build/pins.sh). The image's default Xcode is older
        # (16.4 in run 861330e): with it every kext link warned that libkmod.a was built for a newer macOS than the
        # kext, and the link's warning ceiling of 0 stopped the job. So the newest Xcode of the image that the release
        # accepts is taken, for every step after this one.
        run: |
          min=$(sed -n 's/^NM_PIN_TOOL_XCODE_MIN=\([0-9][0-9.]*\)$/\1/p' build/pins.sh)
          num() { local a b c; IFS=. read -r a b c <<< "$1"; echo $(( ${a:-0} * 1000000 + ${b:-0} * 1000 + ${c:-0} )); }
          [ -n "$min" ] || { echo "::error::build/pins.sh names no NM_PIN_TOOL_XCODE_MIN"; exit 1; }
          best=; bestn=0
          for x in /Applications/Xcode_*.app; do
            v=${x#/Applications/Xcode_}; v=${v%.app}
            [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || continue
            n=$(num "$v")
            if [ "$n" -ge "$(num "$min")" ] && [ "$n" -gt "$bestn" ]; then best=$x; bestn=$n; fi
          done
          [ -n "$best" ] || { echo "::error::no Xcode $min or later on this runner (the release build needs one)"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
          echo "SDK $(DEVELOPER_DIR="$best/Contents/Developer" xcrun --show-sdk-version), $(DEVELOPER_DIR="$best/Contents/Developer" xcrun clang --version | head -1)"
      - name: Compile check with Xcode's kernel headers (also fetches the pinned NVIDIA tree)
        run: bash build/kext_check.sh
      - name: NVIDIA RM core and NVKMS for macOS
        id: rm
        run: |
          W="$RUNNER_TEMP/rm620"; mkdir -p "$W"
          P="$PWD/build-out/kext-check/src/open-gpu-kernel-modules-620.70.06"
          JOBS=$(sysctl -n hw.ncpu) bash build/build_rm620.sh "$W" "$P"
          JOBS=$(sysctl -n hw.ncpu) bash build/build_kms620.sh "$W"
      - name: Link the kexts
        run: |
          W="$RUNNER_TEMP/rm620/ogkm-620.70.06"; O="$RUNNER_TEMP/kexts"
          P="$PWD/build-out/kext-check/src/open-gpu-kernel-modules-620.70.06"
          NVRM_PRISTINE_OGKM="$P" bash build/build_nvrm.sh kexts/NVRM "$W" "$O/nvrm"
          OGKM="$W" bash build/fb_build.sh kexts "$O/fb"
          OGKM="$W" bash build/accel_build_all.sh kexts/NVRM "$O/accel-all"
          bash build/build_agdc.sh kexts/NVRMAGDC "$O/agdc"
          bash kexts/NMSMN/build.sh "$O/nmsmn" 15.0
      - name: No option of the build computer in the compile lines, no Linux kernel helper in NVRM
        # An Intel Mac's clang takes -mfunction-return=thunk-extern when NVIDIA's makefiles ask, and NVRM then imports
        # ___x86_return_thunk, which no macOS defines. The lists are the ones build_rm620.sh and build_kms620.sh compiled;
        # imports.txt is build_nvrm.sh's `nm -u` of the linked NVRM. It runs once the RM and NVKMS are compiled, also when
        # a link failed, so that the compile lines are checked and their checksums printed in every run that has them.
        if: ${{ !cancelled() && steps.rm.outcome == 'success' }}
        run: |
          W="$RUNNER_TEMP/rm620/ogkm-620.70.06"; O="$RUNNER_TEMP/kexts"; bad=0
          for part in nvidia nvidia-modeset; do
            f="$W/src/$part/_out/Darwin_x86_64/compile_cmds.sh"
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; bad=1; continue; }
            hits=$(grep -cE -e '-mfunction-return|-mindirect-branch|-fcf-protection=(full|return)|-Wformat-(overflow|truncation)|-Wstack-usage' "$f" || true)
            if [ "$hits" != 0 ]; then
              echo "::error::$hits compile lines of $part carry an option of the build computer, for example:"
              grep -oE -e '-mfunction-return[^ ]*|-mindirect-branch[^ ]*|-fcf-protection=(full|return)|-Wformat-(overflow|truncation)[^ ]*|-Wstack-usage[^ ]*' "$f" | sort | uniq -c
              bad=1
            fi
            cut="$RUNNER_TEMP/$part.lines"
            # runs of spaces squeezed: macOS's make leaves a space for every option its compiler refused, so the lines
            # of an Intel and an Apple-silicon Mac hold the same words with different spacing
            sed -e "s|$RUNNER_TEMP|<tmp>|g" -e "s|$GITHUB_WORKSPACE|<repo>|g" "$f" | tr -s ' ' > "$cut"
            sum=$(shasum -a 256 < "$cut" | cut -c1-64)
            echo "compile lines of $part: $(wc -l < "$f" | tr -d ' ') lines, sha256 $sum (${{ matrix.runner }}, $(uname -m))"
            # What the checksum is made of, for when the two runs' checksums differ: the same lines in sorted order (a
            # different order only), how many times each option occurs, and the first line.
            echo "::group::what the compile lines of $part are made of"
            echo "sorted: sha256 $(LC_ALL=C sort "$cut" | shasum -a 256 | cut -c1-64)"
            tr ' ' '\n' < "$cut" | grep -e '^-' | LC_ALL=C sort | uniq -c | awk '{ print $1, $2 }'
            echo "first line: $(head -1 "$cut")"
            echo "::endgroup::"
          done
          if [ ! -s "$O/nvrm/imports.txt" ]; then
            echo "::error::$O/nvrm/imports.txt is missing or empty"; bad=1
          elif grep -qE '(^|[[:space:]])___x86_' "$O/nvrm/imports.txt"; then
            grep -E '(^|[[:space:]])___x86_' "$O/nvrm/imports.txt" | sort | uniq -c
            echo "::error::the linked NVRM imports a ___x86_ helper, which no macOS defines: it would not load"; bad=1
          else
            echo "NVRM imports $(wc -l < "$O/nvrm/imports.txt" | tr -d ' ') names, no ___x86_ helper among them"
          fi
          exit $bad
  plugin:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Which Vulkan headers (build/pins.sh)
        id: vkh
        run: echo "commit=$(sed -n 's/^NM_PIN_CI_VKHEADERS_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' build/pins.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9      # v6.1.0
        with:
          path: build-out/ci-vulkan-headers
          key: ci-vulkan-headers-${{ steps.vkh.outputs.commit }}
      - name: Release compile of the Metal plugin
        run: bash build/ci_plugin.sh
